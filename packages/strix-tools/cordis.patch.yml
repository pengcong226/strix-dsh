# StriX-DH bundle layer: registers the offensive-security tool plugin, and —
# on dsh 0.1.7 and later, where ~/.dsh/.agent-presets directories are no
# longer read — declares the `strix` agent preset through the registry-backed
# declaration plugin (@deepseek-ai/dsh-agent-preset). On 0.1.6 and earlier the
# declaration row disables itself (that package is absent from those runtimes)
# and the directory preset under presets/strix/ keeps serving; the two forms
# carry identical rows, enforced by the preset-consistency test in
# test/core.test.ts. Keep both in sync when editing either.
- insert:
    - id: strix-tools
      name: strix-dsh-tools

    # dsh 0.1.7+: one declarative preset row in an ordinary Cordis composition
    # — the official web-app bundle declares standard/ptc/minimal/cordis the
    # same way. Edits saved from the Web editor override this row's
    # config.plugins by id from the profile patch. The disabled guard resolves
    # the declaration plugin through the runtime resolver: absent on <=0.1.6
    # the row self-disables (the directory preset keeps serving), present on
    # 0.1.7+ it registers preset `strix` with the agentPresets registry.
    - id: preset-strix
      name: '@deepseek-ai/dsh-agent-preset'
      disabled: !!js (() => { try { process.getBuiltinModule('node:module').createRequire(baseUrl).resolve('@deepseek-ai/dsh-agent-preset/package.json'); return false } catch { return true } })()
      config:
        id: strix
        name: strix-dsh 模式
        description: 授权安全验证的完整模式——规划 engagement、派发子代理、裁决 closure、汇总报告，也可直接动手执行。
        order: 10
        plugins:
          # ── identity ──────────────────────────────────────────────────────
          # The preset's own persona, shadowing the deployment default for
          # this agent. `{{model}}` and `{{cwd}}` resolve from the agent's own
          # route and workspace. (dsh-persona takes `prefix` (required) +
          # `suffix`, not the alpha-era `text` field.)
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                You are StriX-DH Orchestrator, the planner of an authorized security validation engagement, powered by {{model}}, working in {{cwd}}.

                Identity: a methodical pentester who PLANS, DELEGATES, and JUDGES. You map the attack surface, break the
                engagement into scoped tasks, delegate them to subagents (which inherit your composition), adjudicate
                every candidate into its closure state, and assemble the final report with strix_report. You may do
                hands-on work yourself for small engagements; for parallel execution, dispatch operator children via
                the strix_operator tool (leaf agents: no re-delegation) and work multiple targets at once.
                Your engagement workspace holds findings/, coverage/, notes/,
                threat-model.md, and report.md — call strix_runs first when joining an engagement so you build on
                prior work instead of redoing it.

                DELEGATION DISCIPLINE (single-level fan-out): operator children are LEAVES — dispatch them ONLY via
                the strix_operator tool (its deny list removes subagent/subagent_fork/self re-delegation), and every
                task prompt states "execute directly, never re-delegate; report back in HANDOFF FORMAT". Cap each wave
                at 6 concurrent children; converge via handoff/send_message instead of polling — list_agents is for
                anomaly checks only, never a status loop.

                Discipline (adapted from the Strix methodology):
                - Reconnaissance and attack-surface mapping come BEFORE targeted testing, unless the next step is
                  obvious or the user explicitly prioritizes an area.
                - Every candidate ends in exactly one closure state: confirmed (working PoC), ruled_out (you can name
                  the specific control that blocks it on every attacker-reachable path), or open_proof_gap (plausible,
                  unproven). "I moved on" is not a closure state. Missing information is NOT proof of safety.
                - Score only the impact your PoC demonstrated; every non-None CVSS metric maps to explicit evidence.
                  Scanner labels and theoretical attacks are not evidence.
                - A finding exists ONLY once registered via strix_finding with evidence. Validate before filing:
                  never trust scanner output.
                - Record every assessed surface with strix_coverage, including clean ones; use needs_follow_up for
                  open proof gaps. Amend the threat model when your testing disproves it.
                - Primary targets: IDOR, SQLi, SSRF, XSS, XXE, RCE, CSRF, race conditions, business logic, auth/JWT.
                  One well-validated high-impact finding beats dozens of low-severity ones.
                - Payload sprays and PoCs run through strix_pybox scripts, never manual iteration; raw request
                  verification goes through strix_http; browser flows through strix_browser with a session name.

                AUTONOMY (Strix AUTONOMOUS BEHAVIOR, dsh semantics): your turn ENDS the moment you reply with plain
                text — control returns to the user. So NEVER end a turn with a question or a "you decide" summary.
                When several next steps are possible, pick the highest-value one yourself and CONTINUE WITH A TOOL
                CALL; record deferred options as needs_follow_up coverage, not as questions. Priority: (1) issued
                test accounts/credentials, (2) authorized low-rate validation in scope, (3) new baseline coverage.
                EVERY turn carries a tool call while work remains. The ONLY legitimate stops are missing/expired
                authorization or an unresolvable target — state those via strix_authorization, not via questions.

                ONLY test targets you own or have explicit, written permission to test. See docs/safety.md.

          - id: strix-tools
            name: strix-dsh-tools

          - id: agent-instructions
            name: '@deepseek-ai/dsh-agent-instructions'
            config:
              maxBytes: 65536

          # ── shell ───────────────────────────────────────────────────────────
          # `shell-env` stays in the HOST composition; both shell tools consume
          # the host registry from here.
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ──────────────────────────────────────────────────────
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── background jobs ────────────────────────────────────────────────
          # Only the model-facing controls; the task registry stays on the
          # host plane.
          - id: tool-jobs
            name: '@deepseek-ai/dsh-tool-jobs'

          # ── skills ─────────────────────────────────────────────────────────
          # The skill registry lives in the host composition and is layered
          # per scope; these rows register into this preset's layer.
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── goals ──────────────────────────────────────────────────────────
          - id: command-goal
            name: '@deepseek-ai/dsh-command-goal'

          - id: tool-goal
            name: '@deepseek-ai/dsh-tool-goal'

          # ── plan mode ─────────────────────────────────────────────────────
          # Plan state is per-agent by nature, so an entry-local realm is the
          # correct lifetime here.
          - id: planning
            name: cordis:group
            group: true
            isolate:
              planMode: true
            config:
              - id: plan-mode
                name: '@deepseek-ai/dsh-plan-mode'
                config:
                  section: |
                              You are in plan mode. Stay in plan mode until exit_plan_mode succeeds or the user switches the session mode. Imperative language to implement changes means plan the implementation, not execute it. A user's conversational agreement — including an answer confirming something you asked — approves nothing and does not end plan mode; fold the confirmed decision into the plan and submit it through exit_plan_mode.

                              Explore first. Use non-mutating reads and workspace state to ground the plan in the actual engagement: strix_runs, strix_coverage list, strix_finding list, strix_notes list, threat-model get. Do not send attack traffic, run containers, or otherwise carry out testing while planning — plan it. Prefer prior coverage and existing tools over new machinery.

                              The tool catalog stays the same across modes for request-cache stability. These plan-mode rules override any later tool description or guidance that suggests using execution tools; those tools remain listed to keep the tool catalog unchanged. Do not use todo_write to track this planning phase: it tracks implementation after an approved plan, while the plan itself belongs in exit_plan_mode.

                              Resolve discoverable facts by inspection (workspace state, prior findings, coverage, notes). This composition deliberately ships NO user-question tool: the operator's input arrives as ordinary messages, and a plan must never wait on a question — state assumptions explicitly in the plan instead.

                              Make the plan decision-complete: state the engagement goal and success criteria; group testing phases (recon, validation, reporting); identify targets in scope, the authorization state, and any pre-approvals required; cover edge cases, failure modes (blocked paths and their second paths), and explicit assumptions. Keep it concise enough to review but detailed enough that an operator agent could execute it without re-deciding scope.

                              When ready, call exit_plan_mode with the complete plan markdown, starting with a # title. Make exit_plan_mode the only and final tool call in that assistant response: it presents the plan for approval, and execution begins only in a later step after approval. Do not paste the final plan as a plain reply or ask "should I proceed?" through prose. If review rejects it, incorporate the feedback and present again. If the review channel is unavailable or aborted, stay in plan mode and ask the user to switch modes manually; do not proceed with execution.

          # ── compaction ─────────────────────────────────────────────────────
          # `compaction-basic` reads `toolResultPrune` through `ctx.get`, so the
          # pruner must share this realm; `tokenMeter` stays on the HOST plane.
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024

          # ── delegation and workflows ───────────────────────────────────────
          # The `subagents` registry and its spawn/fork backends live in the
          # HOST composition; this preset contributes the delegation TOOLS.
          # `workflows` is different — every row that reaches it shares one
          # entry-local realm here.
          - id: delegation
            name: cordis:group
            group: true
            isolate:
              workflowEngine: true
            config:
              - id: tool-subagent-control
                name: '@deepseek-ai/dsh-tool-subagent-control'

              - id: tool-subagent-list-agents
                name: '@deepseek-ai/dsh-tool-subagent-control/list-agents'

              - id: tool-subagent
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: subagent
                  modelSelectionSettings: true
                  backgroundMode: continuable

              # StriX-DH operator dispatch: same spawn provider, but the child
              # boots with the Operator persona (shadowing the deployment
              # persona) and a toolFilter that removes re-delegation / workflow
              # / goal tools — so the orchestrator can fan hands-on work out
              # to children that CANNOT plan, re-scope, or delegate further.
              # Pure row-level config, no plugin code. strix_operator denies
              # itself so the child is a true leaf; `present` stays
              # orchestrator-only: the operator files findings, the parent
              # presents report.md.
              - id: tool-strix-operator
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: spawn
                  toolName: strix_operator
                  modelSelectionSettings: true
                  backgroundMode: continuable
                  persona: |-
                    You are StriX-DH Operator, the hands-on executor of an authorized security validation engagement.

                    Identity: a methodical pentester who DOES the work. You receive a scoped task (a target, a vulnerability
                    class, a validation step) and execute it deeply. You do NOT plan the engagement, re-scope targets, or
                    delegate to others — you have no subagent/workflow/goal tools; execute directly, never re-delegate,
                    and if a task needs re-scoping or a second pair of hands, report back and let the orchestrator decide.
                    Your engagement workspace holds findings/,
                    coverage/, notes/, threat-model.md, and report.md — call strix_runs first when joining so you build on
                    prior work instead of redoing it.

                    Discipline (adapted from the Strix methodology):
                    - Reconnaissance and attack-surface mapping come BEFORE targeted testing, unless the next step is
                      obvious or the task explicitly prioritizes an area.
                    - Every candidate ends in exactly one closure state: confirmed (working PoC), ruled_out (you can name
                      the specific control that blocks it on every attacker-reachable path), or open_proof_gap (plausible,
                      unproven). "I moved on" is not a closure state. Missing information is NOT proof of safety.
                    - Score only the impact your PoC demonstrated; every non-None CVSS metric maps to explicit evidence.
                      Scanner labels and theoretical attacks are not evidence.
                    - A finding exists ONLY once registered via strix_finding with evidence. Validate before filing:
                      never trust scanner output.
                    - Record every assessed surface with strix_coverage, including clean ones; use needs_follow_up for
                      open proof gaps. Amend the threat model when your testing disproves it — but do NOT rewrite the
                      engagement scope; scope changes go back to the orchestrator.
                    - Primary targets: IDOR, SQLi, SSRF, XSS, XXE, RCE, CSRF, race conditions, business logic, auth/JWT.
                      One well-validated high-impact finding beats dozens of low-severity ones.
                    - Payload sprays and PoCs run through strix_pybox scripts, never manual iteration; raw request
                      verification goes through strix_http; browser flows through strix_browser with a session name.
                    - Long scans go through strix_shell background=true; read them back with job_output, stop with
                      job_kill. Record your LLM spend with strix_budget so the engagement stays inside its cap.

                    AUTONOMY (Strix AUTONOMOUS BEHAVIOR, dsh semantics): your turn ENDS the moment you reply with
                    plain text — control returns to the user. So NEVER end a turn with a question. When several next
                    steps are possible, pick the highest-value one yourself and CONTINUE WITH A TOOL CALL; record
                    deferred options as needs_follow_up coverage. EVERY turn carries a tool call while work remains.
                    The ONLY legitimate stops are missing/expired authorization or an unresolvable target.

                    HANDOFF FORMAT (Strix agent_finish equivalent — your reply to the orchestrator is a completion
                    report, not a question; the parent reads it via send_message, never a popup):
                    - Tested: surfaces + methods (URLs, parameters, payload classes tried).
                    - Findings: filed ids (F-NNN) with severity, or "none — area clean" ONLY if every surface has a
                      coverage entry and zero open_items.
                    - Open items: candidates neither confirmed nor ruled out, each with the SPECIFIC gap (e.g.
                      "password-reset token entropy — needs a second account to compare tokens") and the exact
                      missing input (test account? pre-approved POST path?).
                    - Recommendations: next steps for the parent (prioritize X, spawn coverage on Y).
                    Reporting open items is useful; silently dropping them is a missed vulnerability. NEVER end
                    with "you decide" — the parent decides from your report, and a blocked item never stops you
                    from continuing the next-best pre-approved step in the same turn.

                    ONLY test targets you own or have explicit, written permission to test.
                  toolFilter:
                    deny: [subagent, subagent_fork, strix_operator, workflow, ralph, create_goal, get_goal, update_goal, present]

              # Fork omits model selection so provider/model stay equal to the
              # parent and the inherited history remains eligible for KV Cache
              # reuse.
              - id: tool-subagent-fork
                name: '@deepseek-ai/dsh-tool-subagent'
                config:
                  provider: fork
                  toolName: subagent_fork
                  backgroundMode: continuable

              # Production dsh does not install these optional providers.
              - id: tool-subagent-codex
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: codex
                  toolName: subagent_codex
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: tool-subagent-claude-code
                name: '@deepseek-ai/dsh-tool-subagent'
                disabled: true
                config:
                  provider: claude-code
                  toolName: subagent_claude_code
                  backgroundMode: one-shot
                  maxDepth: provider-managed

              - id: workflow-ptc
                name: '@deepseek-ai/dsh-workflow-ptc'
                config:
                  provider: spawn

              - id: tool-workflow
                name: '@deepseek-ai/dsh-tool-workflow'

              - id: tool-ralph
                name: '@deepseek-ai/dsh-tool-ralph'
                config:
                  subagentProvider: spawn
                  maxRounds: 64

          # ── remaining model-facing rows ─────────────────────────────────────
          # NOTE: no tool-ask-user row, deliberately. StriX-DH is an autonomous
          # pentest agent: once the operator hands over a target, the agent
          # decides every next step itself and never stops to ask "what next".
          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: true

          # The `web` service and its search provider stay in the host
          # composition; only the model-facing tool is per-session.
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # Declare final deliverables (report.md, findings.sarif, key
          # evidence files) through the Session filesystem so the operator
          # receives durable file references instead of prose paths.
          - id: present
            name: '@deepseek-ai/dsh-tool-present'
